<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Wanderly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Wander<span>ly</span></a>
    <button class="menu-toggle" aria-label="Open navigation">&#9776;</button>
    <nav><a href="index.html">Home</a><a href="destinations.html">Destinations</a><a href="packages.html">Packages</a><a href="about.html">About</a><a class="active" href="contact.html">Contact</a></nav>
  </header>

  <main class="contact-layout container">
    <section>
      <p class="eyebrow">LET'S GO SOMEWHERE</p>
      <h1>Tell us where<br>your heart is.</h1>
      <p>Share a few details and our travel designers will be in touch within 24 hours.</p>
      <p class="contact-detail">&#9993; hello@wanderly.travel</p>
      <p class="contact-detail">&#9742; +91 98765 43210</p>
    </section>
    <form>
      <label>Your name<input required type="text" placeholder="Name"></label>
      <label>Email address<input required type="email" placeholder="you@example.com"></label>
      <label>Destination<select><option>Choose a destination</option><option>Paris</option><option>Dubai</option><option>Bali</option><option>Somewhere else</option></select></label>
      <label>Tell us about your dream trip<textarea placeholder="Dates, travellers, what you love..."></textarea></label>
      <button class="btn btn-dark" type="submit">Send enquiry &rarr;</button>
    </form>
  </main>

  <footer><a class="brand" href="index.html">Wander<span>ly</span></a><p>&copy; 2026 Wanderly. Made for the curious.</p></footer>
</body>
</html>
